name: Apply Transaction CI Repair

on:
  push:
    branches: [codex/pre-phase4-closure]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pre-phase4-closure
          fetch-depth: 0
      - name: Apply targeted transaction verification repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "transaction-service/src/main/java/com/suhasan/finance/transaction_service/service/TransferAuthorizationService.java",
              "    @Transactional(noRollbackFor = Exception.class)\n    public TransactionResponse submit(",
              "    @Transactional\n    public TransactionResponse submit(",
          )

          service = Path("transaction-service/src/main/java/com/suhasan/finance/transaction_service/service/TransactionServiceImpl.java")
          text = service.read_text()
          old = "    @Transactional\n    @CacheEvict(value = \"transaction:history\", allEntries = true)\n    public TransactionResponse reverseTransaction("
          new = "    @Transactional(noRollbackFor = AccountServiceUnavailableException.class)\n    @CacheEvict(value = \"transaction:history\", allEntries = true)\n    public TransactionResponse reverseTransaction("
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected two reversal transaction annotations, found {count}")
          service.write_text(text.replace(old, new, 2))

          limits = Path("transaction-service/src/test/java/com/suhasan/finance/transaction_service/integration/TransactionLimitsIntegrationTest.java")
          text = limits.read_text()
          replacements = [
              (
                  "import com.suhasan.finance.transaction_service.entity.Transaction;\n",
                  "import com.suhasan.finance.transaction_service.entity.Transaction;\nimport com.suhasan.finance.transaction_service.entity.TransactionLimit;\n",
              ),
              (
                  "import com.suhasan.finance.transaction_service.repository.TransactionRepository;\n",
                  "import com.suhasan.finance.transaction_service.repository.TransactionLimitRepository;\nimport com.suhasan.finance.transaction_service.repository.TransactionRepository;\n",
              ),
              (
                  "import org.springframework.boot.test.context.SpringBootTest;\n",
                  "import org.springframework.boot.test.context.SpringBootTest;\nimport org.springframework.cache.CacheManager;\n",
              ),
              (
                  "    private TransactionRepository transactionRepository;\n\n    @Autowired\n    private IntegrationTestConfiguration.JwtTestUtil jwtTestUtil;",
                  "    private TransactionRepository transactionRepository;\n\n    @Autowired\n    private TransactionLimitRepository transactionLimitRepository;\n\n    @Autowired\n    private CacheManager cacheManager;\n\n    @Autowired\n    private IntegrationTestConfiguration.JwtTestUtil jwtTestUtil;",
              ),
              (
                  "        // Clear database before each test\n        transactionRepository.deleteAll();\n",
                  "        // Reset transaction data and install deterministic CHECKING limits.\n        transactionRepository.deleteAll();\n        transactionLimitRepository.deleteAll();\n        transactionLimitRepository.save(TransactionLimit.builder()\n                .accountType(\"CHECKING\")\n                .transactionType(TransactionType.TRANSFER)\n                .perTransactionLimit(BigDecimal.valueOf(10000.00))\n                .active(true)\n                .build());\n        transactionLimitRepository.save(TransactionLimit.builder()\n                .accountType(\"CHECKING\")\n                .transactionType(TransactionType.WITHDRAWAL)\n                .perTransactionLimit(BigDecimal.valueOf(10000.00))\n                .active(true)\n                .build());\n        var limitCache = cacheManager.getCache(\"transaction:limits\");\n        if (limitCache != null) {\n            limitCache.clear();\n        }\n",
              ),
          ]
          for old_text, new_text in replacements:
              count = text.count(old_text)
              if count != 1:
                  raise SystemExit(f"Expected one limit-test match, found {count}: {old_text!r}")
              text = text.replace(old_text, new_text, 1)
          limits.write_text(text)
      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            transaction-service/src/main/java/com/suhasan/finance/transaction_service/service/TransferAuthorizationService.java \
            transaction-service/src/main/java/com/suhasan/finance/transaction_service/service/TransactionServiceImpl.java \
            transaction-service/src/test/java/com/suhasan/finance/transaction_service/integration/TransactionLimitsIntegrationTest.java
          git commit -m "Fix transaction verification rollback and limit fixtures"
          git push origin HEAD:codex/pre-phase4-closure
