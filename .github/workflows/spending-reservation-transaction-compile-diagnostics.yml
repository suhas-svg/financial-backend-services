name: Spending Reservation Transaction Test Compile Diagnostics

on:
  push:
    branches:
      - codex/spending-reservation-payload-safety
    paths:
      - .github/workflows/spending-reservation-transaction-compile-diagnostics.yml

permissions:
  contents: write

jobs:
  test-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile transaction tests
        id: compile
        shell: bash
        run: |
          set +e
          (cd transaction-service && ./mvnw -q -DskipTests test-compile) > /tmp/transaction-test-compile.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Publish test compiler tail
        shell: bash
        env:
          STATUS: ${{ steps.compile.outputs.status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p docs/release-evidence
          {
            echo '# Transaction Reservation Test Compile Diagnostics'
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Workflow run: ${RUN_URL}"
            echo "- test-compile exit: ${STATUS}"
            echo
            echo '```text'
            tail -n 300 /tmp/transaction-test-compile.log
            echo '```'
          } > docs/release-evidence/spending-reservation-transaction-test-compile.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/release-evidence/spending-reservation-transaction-test-compile.md
          git commit -m "Record transaction reservation test compile diagnostics [skip ci]"
          git push origin HEAD:codex/spending-reservation-payload-safety
