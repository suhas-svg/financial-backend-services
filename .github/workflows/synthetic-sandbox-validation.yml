name: Synthetic Sandbox Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  sandbox-config-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate production frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build -- --config vite.sandbox.config.ts
      - name: Validate isolated synthetic topology
        shell: pwsh
        env:
          SANDBOX_IMAGE_TAG: ci-${{ github.sha }}
          ACCOUNT_DB_PASSWORD: ${{ format('ci-{0}-account', github.run_id) }}
          TRANSACTION_DB_PASSWORD: ${{ format('ci-{0}-transaction', github.run_id) }}
          REDIS_PASSWORD: ${{ format('ci-{0}-redis', github.run_id) }}
          JWT_SECRET: ${{ format('ci-{0}-jwt-signing-material-32-bytes', github.run_id) }}
          INTERNAL_JWT_SECRET: ${{ format('ci-{0}-internal-signing-material-32-bytes', github.run_id) }}
          MFA_ENCRYPTION_KEY: ${{ format('ci-{0}-mfa-encryption-material-32-bytes', github.run_id) }}
          SANDBOX_BOOTSTRAP_TOKEN: ${{ format('ci-{0}-bootstrap-token-32-bytes', github.run_id) }}
        run: ./scripts/validate-synthetic-sandbox.ps1
