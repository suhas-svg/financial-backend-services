name: Controlled Beta Release Authority

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 2 * * *' # daily: acceptance on main, load drill, backup/restore drill
    - cron: '17 4 * * 0' # weekly (Sunday): acceptance on main, 4-hour soak drill
  workflow_dispatch:
    inputs:
      drill:
        description: Also run an operational drill (evidence for the readiness gate)
        type: choice
        options: [none, load, soak, restore]
        default: none

permissions:
  contents: read

concurrency:
  # Scheduled and manual runs get their own group, and only pull requests cancel an
  # in-progress run, so a push to main never kills a running soak or restore drill.
  group: release-authority-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule || inputs.drill || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authority-policy:
    name: Acceptance Authority Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the single acceptance authority
        shell: pwsh
        run: ./scripts/verify-release-authority.ps1
      - name: Verify repository deployment authority
        shell: pwsh
        run: ./scripts/verify-repository-authority.ps1
      - name: Self-test Surefire retry governance
        shell: pwsh
        run: ./scripts/test-surefire-retry-governance.ps1
      - name: Self-test production readiness evidence gate
        shell: pwsh
        run: ./scripts/test-production-readiness-evidence.ps1

  frontend:
    name: Frontend Lint, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build -- --config vite.sandbox.config.ts
      - name: Keep page-specific chunks (charts) out of the initial page load
        working-directory: frontend
        run: npm run check:bundle

  # Release blocker: Required Acceptance fails if any WCAG 2.1 AA violation is found.
  accessibility:
    name: Accessibility (WCAG 2.1 AA) Release Blocker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm run build -- --config vite.sandbox.config.ts
      - name: Install the accessibility browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run axe WCAG checks on public and signed-in pages of the production build
        working-directory: frontend
        run: npm run test:a11y
      - name: Upload accessibility traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accessibility-traces
          path: frontend/test-results
          retention-days: 14

  api-contract:
    name: API Contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts
      # The specs themselves are kept equal to what each service serves by OpenApiSpecTest
      # (run in service-verification); this keeps the frontend's generated types in step.
      - name: Generated frontend API types match the committed specs
        working-directory: frontend
        run: npm run api:types:check
      - name: Reject breaking API changes against the base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          # tufin/oasdiff:v1.32.1
          image=tufin/oasdiff@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac
          base_sha=$(git merge-base "origin/${BASE_REF}" HEAD)
          mkdir -p /tmp/api-base
          for spec in account-service transaction-service; do
            file="docs/api/${spec}.openapi.json"
            if ! git cat-file -e "${base_sha}:${file}" 2>/dev/null; then
              echo "::notice::${file} is new; no base version to compare against"
              continue
            fi
            git show "${base_sha}:${file}" > "/tmp/api-base/${spec}.json"
            echo "== ${spec}"
            docker run --rm -v /tmp/api-base:/base:ro -v "$PWD/docs/api:/head:ro" "$image"               breaking "/base/${spec}.json" "/head/${spec}.openapi.json" --fail-on ERR
          done

  service-verification:
    name: ${{ matrix.service }} Verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [account-service, transaction-service]
        java: ['21', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Run the complete Maven verification lifecycle
        working-directory: ${{ matrix.service }}
        run: ./mvnw -q clean verify
      - name: Reject retry-only test success
        working-directory: ${{ matrix.service }}
        shell: pwsh
        run: ../scripts/check-surefire-retries.ps1 -ReportRoots target/surefire-reports

  fresh-migrations:
    name: Fresh PostgreSQL Migrations (${{ matrix.service }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_DB: transaction_migrations
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transaction_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FRESH_ACCOUNT_POSTGRES_URL: jdbc:postgresql://localhost:5432/transaction_migrations
      FRESH_TRANSACTION_POSTGRES_URL: jdbc:postgresql://localhost:5432/transaction_migrations
      FRESH_POSTGRES_USER: postgres
      FRESH_POSTGRES_PASSWORD: postgres
      LEDGER_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/transaction_migrations
      LEDGER_TEST_DB_USER: postgres
      LEDGER_TEST_DB_PASSWORD: postgres
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: account-service
            command: >-
              ./mvnw -q -Dtest=FreshPostgresIntegrationReadinessMigrationTest,SpendingLimitReservationMigrationTest test &&
              ./mvnw -q initialize
              -Dit.test=NotificationDeliveryMigrationIntegrationTest
              failsafe:integration-test failsafe:verify
          - service: transaction-service
            command: >-
              ./mvnw -q
              -Dtest=FreshPostgresIntegrationReadinessMigrationTest,FreshPostgresProviderActivationMigrationTest,OutcomeProtectionMigrationSmokeTest,LedgerMigrationIntegrationTest
              test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Apply every migration to a disposable fresh PostgreSQL database
        working-directory: ${{ matrix.service }}
        run: ${{ matrix.command }}
      - name: Reject retry-only migration test success
        working-directory: ${{ matrix.service }}
        shell: pwsh
        run: ../scripts/check-surefire-retries.ps1 -ReportRoots target/surefire-reports

  duplicate-concurrency-recovery:
    name: Duplicate, Concurrency, Worker Recovery (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: account-service
            tests: NotificationProviderRetryDispatcherTest,NotificationServiceTest,SpendingLimitServiceTest,SpendingLimitReservationConcurrencyTest
          - service: transaction-service
            tests: LedgerPostingConcurrencyIntegrationTest,ScheduledTransferServiceTest,LedgerProjectionOutboxDispatcherTest,TransactionIdempotencyClaimServiceTest,WithdrawalRequestIdempotencyClaimAspectTest,SpendingLimitReservationSagaAspectTest,SpendingLimitReservationClientAspectTest,SpendingLimitRemoteEffectAspectTest,SpendingLimitReservationSagaCoordinatorTest,SpendingLimitReservationCrossServiceIntegrationTest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run financial replay and recovery regressions
        working-directory: ${{ matrix.service }}
        run: ./mvnw -q -Dtest=${{ matrix.tests }} test

  infrastructure:
    name: Helm and Terraform Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Lint and render both Helm charts
        shell: bash
        run: |
          set -euo pipefail
          for chart in account-service transaction-service; do
            repository="validation/${chart}"
            helm lint "infrastructure/helm/${chart}" \
              --set "image.repository=${repository}" \
              --set "image.tag=1.0.0"
            helm template "${chart}" "infrastructure/helm/${chart}" \
              --set "image.repository=${repository}" \
              --set "image.tag=1.0.0" > "/tmp/${chart}.yaml"
            helm template "${chart}" "infrastructure/helm/${chart}" \
              --values "infrastructure/helm/${chart}/values-prod.yaml" \
              --set "image.repository=${repository}" \
              --set "image.tag=1.0.0" > "/tmp/${chart}-prod.yaml"
          done
      - name: Validate and unit-test SLO alert rules
        shell: bash
        run: |
          set -euo pipefail
          # prom/prometheus:v3.5.0
          image=prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          rules="$PWD/infrastructure/observability/prometheus"
          docker run --rm -v "$rules:/rules:ro" -w /rules --entrypoint promtool "$image" check rules slo-rules.yml
          docker run --rm -v "$rules:/rules:ro" -w /rules --entrypoint promtool "$image" test rules slo-rules.test.yml
      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - name: Initialize and validate every Terraform root without a backend
        shell: bash
        run: |
          set -euo pipefail
          for root in infrastructure/terraform \
            infrastructure/terraform/environments/dev \
            infrastructure/terraform/environments/staging \
            infrastructure/terraform/environments/prod; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
      - name: Scan Terraform and Kubernetes policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  synthetic-api-browser-e2e:
    name: Canonical Synthetic API and Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: financial-synthetic-sandbox-ci-${{ github.run_id }}
      SANDBOX_IMAGE_TAG: ci-${{ github.sha }}
      SANDBOX_BASE_URL: https://127.0.0.1:8443
      SANDBOX_OPERATOR_USERNAME: release_operator
      SANDBOX_OPERATOR_PASSWORD: ci-${{ github.run_id }}-operator-password
      ACCOUNT_DB_PASSWORD: ci-${{ github.run_id }}-account-db
      TRANSACTION_DB_PASSWORD: ci-${{ github.run_id }}-transaction-db
      REDIS_PASSWORD: ci-${{ github.run_id }}-redis
      MFA_ENCRYPTION_KEY: ci-${{ github.run_id }}-mfa-encryption-material-at-least-32-bytes
      SANDBOX_BOOTSTRAP_TOKEN: ci-${{ github.run_id }}-bootstrap-token-at-least-32-bytes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate the isolated seven-service synthetic topology
        shell: pwsh
        run: ./scripts/validate-synthetic-sandbox.ps1
      - name: Build and start a fresh synthetic sandbox
        run: docker compose -f docker-compose.synthetic-sandbox.yml up --build --detach --wait
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run the canonical API and browser contract
        working-directory: frontend
        run: npx playwright test --config playwright.sandbox.config.ts
      - name: Capture bounded failure diagnostics
        if: failure()
        run: docker compose -f docker-compose.synthetic-sandbox.yml ps
      - name: Remove the disposable sandbox and its volumes
        if: always()
        run: docker compose -f docker-compose.synthetic-sandbox.yml down --volumes --remove-orphans

  container-supply-chain:
    name: Container Scan and SBOM (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: account-service
            context: account-service
            dockerfile: account-service/Dockerfile
          - image: transaction-service
            context: transaction-service
            dockerfile: transaction-service/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.sandbox
          - image: gateway
            context: infrastructure/synthetic-sandbox/gateway
            dockerfile: infrastructure/synthetic-sandbox/gateway/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the exact checkout image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --build-arg "APP_VERSION=sha-${{ github.sha }}"
          --build-arg "VCS_REF=${{ github.sha }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          --tag "financial-${{ matrix.image }}:${{ github.sha }}"
          "${{ matrix.context }}"
      - name: Fail on high or critical container vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: financial-${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate an SPDX JSON SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: financial-${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.image }}.spdx.json
          upload-artifact: false
      - name: Upload the bounded SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}.spdx.json
          retention-days: 14

  dependency-scan:
    name: Backend Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Cache OWASP dependency data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-data-${{ runner.os }}-
      - name: Scan backend dependencies against cached NVD data only
        shell: bash
        run: |
          set -euo pipefail
          data_dir="${HOME}/.m2/repository/org/owasp/dependency-check-data"
          if [ -z "$(find "${data_dir}" -type f -print -quit)" ]; then
            echo "::warning::No cached OWASP dependency data is available; skipping the backend dependency scan without downloading NVD data"
            exit 0
          fi
          echo "::notice::Running the backend dependency scan against restored OWASP dependency data"
          (cd account-service && ./mvnw -q org.owasp:dependency-check-maven:check -DskipTests -DautoUpdate=false -DdataDirectory="${data_dir}")
          (cd transaction-service && ./mvnw -q org.owasp:dependency-check-maven:check -DskipTests -DautoUpdate=false -DdataDirectory="${data_dir}")

  secret-scan:
    name: Full-History Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  release-authority:
    name: Required Acceptance
    if: always()
    needs:
      - authority-policy
      - frontend
      - accessibility
      - api-contract
      - service-verification
      - fresh-migrations
      - duplicate-concurrency-recovery
      - infrastructure
      - synthetic-api-browser-e2e
      - container-supply-chain
      - dependency-scan
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require every controlled-beta acceptance gate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        shell: python
        run: |
          import json, os, sys
          results = {name: data["result"] for name, data in json.loads(os.environ["NEEDS_JSON"]).items()}
          failed = {name: result for name, result in results.items() if result != "success"}
          print(json.dumps(results, indent=2, sort_keys=True))
          sys.exit(1 if failed else 0)

  # ── Operational drills (scheduled on main, or on demand) ───────────────────────────
  # Evidence for the LOAD_SOAK and BACKUP_RESTORE readiness gates. Each run uploads an
  # evidence archive (kept 90 days) and prints the reference and evidenceSha256 for the
  # external readiness manifest. See docs/operations/load-soak-restore-drills.md.
  load-soak-drill:
    name: Load or Soak Drill (k6 transfers)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.drill == 'load' || inputs.drill == 'soak'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # Weekly cron or drill=soak: 4 h at 3 transfers/s pairs. Otherwise a 10 min ramp to 10/s.
      DRILL: ${{ (github.event.schedule == '17 4 * * 0' || inputs.drill == 'soak') && 'soak' || 'load' }}
      SANDBOX_IMAGE_TAG: drill-${{ github.sha }}
      SANDBOX_PROFILE: synthetic-sandbox
      BASE_URL: https://127.0.0.1:8443
      SANDBOX_OPERATOR_USERNAME: drill_operator
      SANDBOX_OPERATOR_PASSWORD: drill-${{ github.run_id }}-operator-password
      ACCOUNT_DB_PASSWORD: drill-${{ github.run_id }}-account-db
      TRANSACTION_DB_PASSWORD: drill-${{ github.run_id }}-transaction-db
      REDIS_PASSWORD: drill-${{ github.run_id }}-redis
      MFA_ENCRYPTION_KEY: drill-${{ github.run_id }}-mfa-encryption-material-at-least-32-bytes
      SANDBOX_BOOTSTRAP_TOKEN: drill-${{ github.run_id }}-bootstrap-token-at-least-32-bytes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install k6 v2.3.0 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k6.tgz https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  /tmp/k6.tgz" | sha256sum -c -
          tar -xzf /tmp/k6.tgz -C /tmp
          sudo install /tmp/k6-v2.3.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Start a fresh synthetic sandbox with the load profile
        run: >-
          docker compose -f docker-compose.synthetic-sandbox.yml -f docker-compose.synthetic-load.yml
          up --build --detach --wait
      - name: Lift per-account transfer count limits (load profile only)
        # Checking accounts allow 20 transfers a day and 200 a month per customer; a load
        # test is one customer making thousands. Amount limits stay in force.
        run: >-
          docker compose -f docker-compose.synthetic-sandbox.yml exec -T transaction-postgres
          psql -U transaction_app -d transaction_sandbox -v ON_ERROR_STOP=1 -c
          "UPDATE transaction_limits SET daily_count = NULL, monthly_count = NULL WHERE transaction_type = 'TRANSFER'"
      - name: Run the transfer scenario while checking financial invariants
        id: drill
        shell: bash
        run: |
          # Actions runs bash with -e; keep going after a failed k6 threshold so the final
          # invariant check and the evidence summary are still recorded. The job fails later.
          set +e -uo pipefail
          case "$DRILL" in
            soak) duration=4h; rate=3;  interval=15; run_minutes=245 ;;
            *)    duration=8m; rate=10; interval=5;  run_minutes=12 ;;
          esac
          mkdir -p evidence/invariants
          # Invariant checkpoints (balanced journals, no duplicate idempotency keys, no stuck
          # runs or terminal outbox entries) for the whole run, recorded as NDJSON.
          pwsh -NoProfile -File scripts/run-synthetic-soak.ps1 -EvidenceDirectory evidence/invariants \
            -RunMinutes "$run_minutes" -IntervalMinutes "$interval" > evidence/invariants/runner.log 2>&1 &
          checker=$!
          k6 run --quiet -e PROFILE="$DRILL" -e DURATION="$duration" -e RATE="$rate" \
            -e SUMMARY_PATH=evidence/k6-summary.json performance/k6/transfers.js | tee evidence/k6-output.txt
          k6_status=${PIPESTATUS[0]}
          kill "$checker" 2>/dev/null || true
          wait "$checker" 2>/dev/null || true
          # One last checkpoint after the load stops.
          pwsh -NoProfile -File scripts/run-synthetic-soak.ps1 -EvidenceDirectory evidence/invariants -SingleCheck
          final_status=$?
          unhealthy=$(grep -c '"healthy":false' evidence/invariants/checks.ndjson || true)
          metric() { jq -r "$1 // \"n/a\"" evidence/k6-summary.json 2>/dev/null || echo n/a; }
          p99=$(metric '.metrics["http_req_duration{name:transfer}"].values["p(99)"]')
          errors=$(metric '.metrics["server_errors{name:transfer}"].values.rate')
          iterations=$(metric '.metrics.iterations.values.count')
          echo "summary=transfer p99 ${p99} ms; transfer 5xx rate ${errors}; iterations ${iterations} (2 transfers each); unhealthy invariant checkpoints ${unhealthy}" >> "$GITHUB_OUTPUT"
          if [ "$k6_status" -eq 0 ] && [ "$final_status" -eq 0 ] && [ "$unhealthy" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture service logs for the evidence
        if: always() && steps.drill.outcome != 'skipped'
        run: |
          mkdir -p evidence/service-logs
          for service in account-service transaction-service gateway account-postgres transaction-postgres redis; do
            docker compose -f docker-compose.synthetic-sandbox.yml -f docker-compose.synthetic-load.yml               logs --no-color --timestamps --tail 20000 "$service" > "evidence/service-logs/${service}.log" 2>&1 || true
          done
      - name: Package evidence for the LOAD_SOAK gate
        if: always() && steps.drill.outcome != 'skipped'
        shell: pwsh
        env:
          PASSED: ${{ steps.drill.outputs.passed }}
          SUMMARY: ${{ steps.drill.outputs.summary }}
        run: >-
          ./scripts/package-drill-evidence.ps1 -Gate LOAD_SOAK -Drill $env:DRILL
          -EvidenceDirectory evidence -OutputDirectory evidence-out
          -Passed ($env:PASSED -eq 'true') -Summary "$env:SUMMARY"
      - name: Upload evidence
        if: always() && steps.drill.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ env.DRILL }}-${{ github.run_id }}
          path: evidence-out
          retention-days: 90
      - name: Fail when the drill missed a threshold or broke an invariant
        if: steps.drill.outputs.passed != 'true'
        run: exit 1
      - name: Remove the disposable sandbox and its volumes
        if: always()
        run: docker compose -f docker-compose.synthetic-sandbox.yml -f docker-compose.synthetic-load.yml down --volumes --remove-orphans

  backup-restore-drill:
    name: Backup Restore Drill (RTO/RPO)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.drill == 'restore')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANDBOX_IMAGE_TAG: drill-${{ github.sha }}
      SANDBOX_PROFILE: synthetic-sandbox
      BASE_URL: https://127.0.0.1:8443
      SANDBOX_OPERATOR_USERNAME: drill_operator
      SANDBOX_OPERATOR_PASSWORD: drill-${{ github.run_id }}-operator-password
      ACCOUNT_DB_PASSWORD: drill-${{ github.run_id }}-account-db
      TRANSACTION_DB_PASSWORD: drill-${{ github.run_id }}-transaction-db
      REDIS_PASSWORD: drill-${{ github.run_id }}-redis
      MFA_ENCRYPTION_KEY: drill-${{ github.run_id }}-mfa-encryption-material-at-least-32-bytes
      SANDBOX_BOOTSTRAP_TOKEN: drill-${{ github.run_id }}-bootstrap-token-at-least-32-bytes
      # Recovery objectives; override with repository variables once the real ones are set.
      RTO_TARGET_SECONDS: ${{ vars.DRILL_RTO_TARGET_SECONDS || '900' }}
      RPO_TARGET_SECONDS: ${{ vars.DRILL_RPO_TARGET_SECONDS || '900' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install k6 v2.3.0 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k6.tgz https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  /tmp/k6.tgz" | sha256sum -c -
          tar -xzf /tmp/k6.tgz -C /tmp
          sudo install /tmp/k6-v2.3.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Start a fresh synthetic sandbox
        run: >-
          docker compose -f docker-compose.synthetic-sandbox.yml -f docker-compose.synthetic-load.yml
          up --build --detach --wait
      - name: Lift per-account transfer count limits (load profile only)
        # Checking accounts allow 20 transfers a day and 200 a month per customer; a load
        # test is one customer making thousands. Amount limits stay in force.
        run: >-
          docker compose -f docker-compose.synthetic-sandbox.yml exec -T transaction-postgres
          psql -U transaction_app -d transaction_sandbox -v ON_ERROR_STOP=1 -c
          "UPDATE transaction_limits SET daily_count = NULL, monthly_count = NULL WHERE transaction_type = 'TRANSFER'"
      - name: Write ledger activity to back up, then pause writes
        run: >-
          k6 run --quiet -e PROFILE=load -e DURATION=2m -e RATE=5
          -e SUMMARY_PATH=/tmp/seed-load-summary.json performance/k6/transfers.js
      - name: Back up both databases, restore into isolated targets, verify against RTO/RPO
        id: drill
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force evidence | Out-Null
          $bundle = ./scripts/backup-synthetic-sandbox.ps1 -OutputDirectory backups | Select-Object -Last 1
          Copy-Item (Join-Path $bundle "backup-receipt.json") evidence/
          $passed = $true
          try {
            ./scripts/restore-verify-synthetic-sandbox.ps1 -BackupDirectory $bundle `
              -Confirmation "RESTORE TO ISOLATED SYNTHETIC TARGET" -EvidenceDirectory evidence `
              -RtoTargetSeconds ([int]$env:RTO_TARGET_SECONDS) -RpoTargetSeconds ([int]$env:RPO_TARGET_SECONDS)
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            $passed = $false
          }
          $result = Get-ChildItem evidence -Filter "restore-*.json" | Select-Object -First 1
          $summary = if ($result) {
            $r = Get-Content -Raw $result.FullName | ConvertFrom-Json
            "RTO $($r.objectives.rtoSeconds)s (target $($r.objectives.rtoTargetSeconds)s); " +
            "RPO $($r.objectives.rpoSeconds)s (target $($r.objectives.rpoTargetSeconds)s); " +
            "restored data matches backup: $(@($r.results | Where-Object { -not $_.matchesBackup }).Count -eq 0)"
          } else { "restore did not complete" }
          "passed=$($passed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "summary=$summary" >> $env:GITHUB_OUTPUT
      - name: Capture service logs for the evidence
        if: always() && steps.drill.outcome != 'skipped'
        run: |
          mkdir -p evidence/service-logs
          for service in account-service transaction-service gateway account-postgres transaction-postgres redis; do
            docker compose -f docker-compose.synthetic-sandbox.yml -f docker-compose.synthetic-load.yml               logs --no-color --timestamps --tail 20000 "$service" > "evidence/service-logs/${service}.log" 2>&1 || true
          done
      - name: Package evidence for the BACKUP_RESTORE gate
        if: always() && steps.drill.outcome != 'skipped'
        shell: pwsh
        env:
          PASSED: ${{ steps.drill.outputs.passed }}
          SUMMARY: ${{ steps.drill.outputs.summary }}
        run: >-
          ./scripts/package-drill-evidence.ps1 -Gate BACKUP_RESTORE -Drill Restore
          -EvidenceDirectory evidence -OutputDirectory evidence-out
          -Passed ($env:PASSED -eq 'true') -Summary "$env:SUMMARY"
      - name: Upload evidence
        if: always() && steps.drill.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-restore-${{ github.run_id }}
          path: evidence-out
          retention-days: 90
      - name: Fail when recovery missed an objective or lost data
        if: steps.drill.outputs.passed != 'true'
        run: exit 1
      - name: Remove the disposable sandbox and its volumes
        if: always()
        run: docker compose -f docker-compose.synthetic-sandbox.yml -f docker-compose.synthetic-load.yml down --volumes --remove-orphans

  # ── Releases (main only, and only after every acceptance gate passed) ─────────────
  # release-please keeps a release PR open with the next version and CHANGELOG entry,
  # computed from Conventional Commits. Merging that PR tags vX.Y.Z and publishes images.
  # Set the RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App token with
  # contents + pull-requests write) so CI runs on the release PR; PRs opened with the
  # default GITHUB_TOKEN do not trigger workflows and could not pass Required Acceptance.
  release-please:
    name: Release PR and Tag
    needs: release-authority
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-authority.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish Release Image (${{ matrix.image }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [account-service, transaction-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Build and push the release image, tagged by version and by commit
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/financial-${{ matrix.image }}"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build             --file "${{ matrix.image }}/Dockerfile"             --build-arg "APP_VERSION=${VERSION}"             --build-arg "VCS_REF=${revision}"             --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --label "org.opencontainers.image.version=${VERSION}"             --label "org.opencontainers.image.revision=${revision}"             --tag "${image}:${VERSION}"             --tag "${image}:sha-${revision}"             "${{ matrix.image }}"
          docker push "${image}:${VERSION}"
          docker push "${image}:sha-${revision}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${VERSION}")"
          {
            echo "### ${{ matrix.image }} ${VERSION}"
            echo "- \`${image}:${VERSION}\`"
            echo "- \`${image}:sha-${revision}\`"
            echo "- Deploy by digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
