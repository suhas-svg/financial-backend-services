name: Spending Reservation Smoke Verify

on:
  push:
    branches:
      - codex/spending-reservation-smoke-verify
    paths-ignore:
      - docs/release-evidence/spending-reservation-smoke-verify.md

permissions:
  contents: write

jobs:
  account-lifecycle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - working-directory: account-service
        run: ./mvnw --batch-mode -Dtest=SpendingLimitReservationTest,SpendingLimitServiceLifecycleEdgeTest test

  transaction-integration-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - working-directory: transaction-service
        run: ./mvnw --batch-mode -Dtest=TransactionIntegrationTest test

  smoke-authority:
    if: always()
    needs: [account-lifecycle-tests, transaction-integration-context]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/spending-reservation-smoke-verify
      - name: Publish smoke result
        env:
          ACCOUNT_RESULT: ${{ needs.account-lifecycle-tests.result }}
          TRANSACTION_RESULT: ${{ needs.transaction-integration-context.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/release-evidence
          cat > docs/release-evidence/spending-reservation-smoke-verify.md <<EOF
          # Spending Reservation Smoke Verification

          - Source commit: \`${SOURCE_SHA}\`
          - Workflow run: ${RUN_URL}
          - Account lifecycle tests: ${ACCOUNT_RESULT}
          - Transaction integration context: ${TRANSACTION_RESULT}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/release-evidence/spending-reservation-smoke-verify.md
          git diff --cached --quiet || git commit -m "Record spending reservation smoke verification [skip ci]"
          git push origin HEAD:codex/spending-reservation-smoke-verify
          test "${ACCOUNT_RESULT}" = "success"
          test "${TRANSACTION_RESULT}" = "success"
