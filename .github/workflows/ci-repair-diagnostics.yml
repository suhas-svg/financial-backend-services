name: CI Repair Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-service-verification:
    name: Transaction service Java ${{ matrix.java }} diagnostics
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Run Maven verification
        id: verify
        continue-on-error: true
        working-directory: transaction-service
        run: ./mvnw -q clean verify
      - name: Build compact failure summary
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostic-summary
          grep -RhnE 'testsuite .* failures="[1-9]|testsuite .* errors="[1-9]|<failure|<error|MissingRequestHeaderException|INTERNAL_SERVER_ERROR|Caused by:' \
            transaction-service/target/surefire-reports \
            transaction-service/target/failsafe-reports \
            > diagnostic-summary/java-${{ matrix.java }}-failures.txt 2>/dev/null || true
      - name: Upload Maven reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-service-java-${{ matrix.java }}-reports
          path: |
            transaction-service/target/surefire-reports
            transaction-service/target/failsafe-reports
            diagnostic-summary
          retention-days: 3
          if-no-files-found: warn
      - name: Preserve verification result
        if: steps.verify.outcome == 'failure'
        run: exit 1
