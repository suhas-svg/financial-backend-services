name: Spending Reservation Test Diagnostics

on:
  push:
    branches:
      - codex/spending-reservation-payload-safety
    paths:
      - .github/workflows/spending-reservation-test-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: reservation_diagnostics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservation_diagnostics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FRESH_TRANSACTION_POSTGRES_URL: jdbc:postgresql://localhost:5432/reservation_diagnostics
      FRESH_POSTGRES_USER: postgres
      FRESH_POSTGRES_PASSWORD: postgres
      LEDGER_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/reservation_diagnostics
      LEDGER_TEST_DB_USER: postgres
      LEDGER_TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply account test-contract and ownership corrections
        shell: python
        run: |
          from pathlib import Path

          service = Path("account-service/src/main/java/com/suhasan/finance/account_service/service/SpendingLimitService.java")
          text = service.read_text(encoding="utf-8")
          old = '''        final Account account = accounts.findByIdForUpdate(accountId)
                  .orElseThrow(() -> new IllegalArgumentException("Account not found"));
          final SpendingLimitReservation reservation = reservations
                  .findFirstByAccountIdAndIdempotencyKeyOrderByCreatedAtAsc(accountId, normalizeKey(idempotencyKey))
                  .orElse(null);
          if (reservation == null) {
              return false;
          }
          '''
          new = '''        final Account account = accounts.findByIdForUpdate(accountId)
                  .orElseThrow(() -> new IllegalArgumentException("Account not found"));
          if (!Objects.equals(account.getOwnerId(), userId.trim())) {
              throw new AccessDeniedException("Account ownership required");
          }
          final SpendingLimitReservation reservation = reservations
                  .findFirstByAccountIdAndIdempotencyKeyOrderByCreatedAtAsc(accountId, normalizeKey(idempotencyKey))
                  .orElse(null);
          if (reservation == null) {
              return false;
          }
          '''
          if old not in text:
              raise SystemExit("legacy release block not found")
          service.write_text(text.replace(old, new, 1), encoding="utf-8")

          additional = Path("account-service/src/test/java/com/suhasan/finance/account_service/service/SpendingLimitServiceAdditionalTest.java")
          text = additional.read_text(encoding="utf-8")
          old = '''        CheckingAccount other = account("bob");
          when(accounts.findById(1L)).thenReturn(Optional.of(other));
          assertThatThrownBy(() -> service.reserve(1L, reserve("TRANSFER", "1", "alice")))
          '''
          new = '''        CheckingAccount other = account("bob");
          when(accounts.findByIdForUpdate(1L)).thenReturn(Optional.of(other));
          assertThatThrownBy(() -> service.reserve(1L, reserve("TRANSFER", "1", "alice")))
          '''
          if old not in text:
              raise SystemExit("reserve ownership test block not found")
          additional.write_text(text.replace(old, new, 1), encoding="utf-8")

          concurrency = Path("account-service/src/test/java/com/suhasan/finance/account_service/service/SpendingLimitReservationConcurrencyTest.java")
          text = concurrency.read_text(encoding="utf-8")
          old = '''            assertThat(winner.get().getAmount()).isIn(new BigDecimal("25.00"), new BigDecimal("30.00"));
          '''
          new = '''            assertThat(winner.get().getAmount().stripTrailingZeros()).isIn(
                      new BigDecimal("25.00").stripTrailingZeros(),
                      new BigDecimal("30.00").stripTrailingZeros());
          '''
          if old not in text:
              raise SystemExit("concurrency amount assertion not found")
          concurrency.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Run corrected account reservation tests
        id: account
        shell: bash
        run: |
          set +e
          (cd account-service && ./mvnw -q -Dtest=SpendingLimitServiceTest,SpendingLimitServiceAdditionalTest,SpendingLimitReservationConcurrencyTest test) > /tmp/account-tests.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Compile transaction tests
        id: transaction_compile
        shell: bash
        run: |
          set +e
          (cd transaction-service && ./mvnw -q -DskipTests test-compile) > /tmp/transaction-test-compile.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Run transaction focused tests
        id: transaction_focused
        shell: bash
        run: |
          set +e
          (cd transaction-service && ./mvnw -q -Dtest=TransactionIdempotencyClaimServiceTest,WithdrawalRequestIdempotencyClaimAspectTest,SpendingLimitReservationSagaAspectTest,SpendingLimitReservationClientAspectTest,SpendingLimitRemoteEffectAspectTest,SpendingLimitReservationSagaCoordinatorTest,SpendingLimitReservationCrossServiceIntegrationTest test) > /tmp/transaction-focused.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Run transaction PostgreSQL migration tests
        id: transaction_migrations
        shell: bash
        run: |
          set +e
          (cd transaction-service && ./mvnw -q -Dtest=FreshPostgresIntegrationReadinessMigrationTest,LedgerMigrationIntegrationTest test) > /tmp/transaction-migrations.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostics and verified account patches
        shell: bash
        env:
          ACCOUNT_STATUS: ${{ steps.account.outputs.status }}
          TRANSACTION_COMPILE_STATUS: ${{ steps.transaction_compile.outputs.status }}
          TRANSACTION_FOCUSED_STATUS: ${{ steps.transaction_focused.outputs.status }}
          TRANSACTION_MIGRATION_STATUS: ${{ steps.transaction_migrations.outputs.status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p docs/release-evidence
          {
            echo '# Spending Reservation Test Diagnostics'
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Workflow run: ${RUN_URL}"
            echo "- corrected account focused tests exit: ${ACCOUNT_STATUS}"
            echo "- transaction test-compile exit: ${TRANSACTION_COMPILE_STATUS}"
            echo "- transaction focused tests exit: ${TRANSACTION_FOCUSED_STATUS}"
            echo "- transaction migration tests exit: ${TRANSACTION_MIGRATION_STATUS}"
            for item in account-tests transaction-test-compile transaction-focused transaction-migrations; do
              echo
              echo "## ${item} tail"
              echo
              echo '```text'
              tail -n 220 "/tmp/${item}.log"
              echo '```'
            done
          } > docs/release-evidence/spending-reservation-test-diagnostics.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ "$ACCOUNT_STATUS" == "0" ]]; then
            git add \
              account-service/src/main/java/com/suhasan/finance/account_service/service/SpendingLimitService.java \
              account-service/src/test/java/com/suhasan/finance/account_service/service/SpendingLimitServiceAdditionalTest.java \
              account-service/src/test/java/com/suhasan/finance/account_service/service/SpendingLimitReservationConcurrencyTest.java \
              docs/release-evidence/spending-reservation-test-diagnostics.md
            git commit -m "Fix account reservation ownership and assertions"
          else
            git restore account-service/src/main/java/com/suhasan/finance/account_service/service/SpendingLimitService.java \
              account-service/src/test/java/com/suhasan/finance/account_service/service/SpendingLimitServiceAdditionalTest.java \
              account-service/src/test/java/com/suhasan/finance/account_service/service/SpendingLimitReservationConcurrencyTest.java
            git add docs/release-evidence/spending-reservation-test-diagnostics.md
            git commit -m "Record spending reservation test diagnostics [skip ci]"
          fi
          git push origin HEAD:codex/spending-reservation-payload-safety
