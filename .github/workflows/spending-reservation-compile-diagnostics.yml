name: Spending Reservation Compile Diagnostics

on:
  push:
    branches:
      - codex/spending-reservation-payload-safety
    paths:
      - .github/workflows/spending-reservation-compile-diagnostics.yml

permissions:
  contents: write

jobs:
  compile-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply notification enum import correction
        shell: bash
        run: |
          set -euo pipefail
          service=account-service/src/main/java/com/suhasan/finance/account_service/service/SpendingLimitService.java
          sed -i 's/import com\.suhasan\.finance\.account_service\.dto\.NotificationSeverity;/import com.suhasan.finance.account_service.entity.NotificationSeverity;/' "$service"
          sed -i 's/import com\.suhasan\.finance\.account_service\.dto\.NotificationSourceType;/import com.suhasan.finance.account_service.entity.NotificationSourceType;/' "$service"
          sed -i 's/import com\.suhasan\.finance\.account_service\.dto\.NotificationType;/import com.suhasan.finance.account_service.entity.NotificationType;/' "$service"
          git diff --check
      - name: Compile both services and capture output
        id: compile
        shell: bash
        run: |
          set +e
          (cd account-service && ./mvnw -q -DskipTests compile) > /tmp/account-compile.log 2>&1
          account_status=$?
          (cd transaction-service && ./mvnw -q -DskipTests compile) > /tmp/transaction-compile.log 2>&1
          transaction_status=$?
          echo "account_status=${account_status}" >> "$GITHUB_OUTPUT"
          echo "transaction_status=${transaction_status}" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostics and verified correction
        shell: bash
        env:
          ACCOUNT_STATUS: ${{ steps.compile.outputs.account_status }}
          TRANSACTION_STATUS: ${{ steps.compile.outputs.transaction_status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p docs/release-evidence
          {
            echo '# Spending Reservation Compile Diagnostics'
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Workflow run: ${RUN_URL}"
            echo "- account-service compile exit: ${ACCOUNT_STATUS}"
            echo "- transaction-service compile exit: ${TRANSACTION_STATUS}"
            echo
            echo '## account-service compiler tail'
            echo
            echo '```text'
            tail -n 160 /tmp/account-compile.log
            echo '```'
            echo
            echo '## transaction-service compiler tail'
            echo
            echo '```text'
            tail -n 160 /tmp/transaction-compile.log
            echo '```'
          } > docs/release-evidence/spending-reservation-compile-diagnostics.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ "$ACCOUNT_STATUS" == "0" && "$TRANSACTION_STATUS" == "0" ]]; then
            git add account-service/src/main/java/com/suhasan/finance/account_service/service/SpendingLimitService.java \
              docs/release-evidence/spending-reservation-compile-diagnostics.md
            git commit -m "Fix notification enum imports"
          else
            git restore account-service/src/main/java/com/suhasan/finance/account_service/service/SpendingLimitService.java
            git add docs/release-evidence/spending-reservation-compile-diagnostics.md
            git commit -m "Record spending reservation compile diagnostics [skip ci]"
          fi
          git push origin HEAD:codex/spending-reservation-payload-safety
