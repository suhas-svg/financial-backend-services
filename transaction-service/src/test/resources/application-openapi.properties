# OpenApiSpecTest: start the web layer without PostgreSQL, Redis or background work.
# No DDL or migrations run, so PostgreSQL-only column types never reach H2.
spring.datasource.url=jdbc:h2:mem:openapi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
app.scheduling.enabled=false
account-service.base-url=http://localhost:9
