spring.application.name=transaction-service
spring.profiles.default=dev
server.port=8081
spring.cloud.compatibility-verifier.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
ledger.bootstrap.system-currencies=${LEDGER_BOOTSTRAP_SYSTEM_CURRENCIES:USD,EUR,GBP,INR}
ledger.bootstrap.startup.enabled=${LEDGER_BOOTSTRAP_STARTUP_ENABLED:false}
ledger.bootstrap.startup.maintenance-mode=${LEDGER_BOOTSTRAP_STARTUP_MAINTENANCE_MODE:false}


ledger.authoritative=true

# Money movement holds up to two connections at once (its transaction plus independently
# committed claims/effect records). The bulkhead caps concurrent movements so that
# max-concurrent x 2 stays below the pool and the pool can never deadlock; see
# MoneyMovementBulkhead. Raise both together.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
transaction.money-movement.max-concurrent=${MONEY_MOVEMENT_MAX_CONCURRENCY:8}
transaction.money-movement.max-wait-ms=${MONEY_MOVEMENT_MAX_WAIT_MS:5000}
spring.datasource.hikari.minimum-idle=5

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.prometheus.enabled=true
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=${spring.profiles.active:${spring.profiles.default}}

# Observability. Traces are exported over OTLP only when
# MANAGEMENT_OTLP_TRACING_ENDPOINT is set (e.g. http://otel-collector:4318/v1/traces);
# trace and span IDs are always added to log lines.
# Static bearer token Prometheus uses for /actuator/prometheus (>= 32 chars);
# unset keeps the endpoint restricted to admin/internal-service JWTs.
management.prometheus.scrape-token=${METRICS_SCRAPE_TOKEN:}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
# One span per SQL statement (statement text only; bound values stay out of traces).
jdbc.includes=QUERY
jdbc.datasource-proxy.include-parameter-values=false
# Histogram buckets at the latency SLO thresholds (see infrastructure/observability).
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2500ms
management.metrics.distribution.slo.http.client.requests=100ms,250ms,500ms,1s,2500ms
# Replaces a custom WebClient.Builder bean that bypassed Boot's observation customizers.
spring.codec.max-in-memory-size=1MB

# Token keys (no secret is shared between services).
# User access tokens: RS256, signed by account-service, verified against its published keys.
security.jwt.jwks-uri=${JWT_JWKS_URI:${account-service.base-url:http://localhost:8080}/.well-known/jwks.json}
security.jwt.public-key=${JWT_PUBLIC_KEY:}
# Internal service tokens to account-service: RS256 with this service's own key, published at
# /.well-known/jwks.json. PKCS#8 PEM; without one a temporary key is generated (single local
# process only); shared environments set JWT_INTERNAL_ALLOW_GENERATED_KEY=false.
security.jwt.internal.signing.private-key=${JWT_INTERNAL_SIGNING_PRIVATE_KEY:}
security.jwt.internal.signing.key-id=${JWT_INTERNAL_SIGNING_KEY_ID:}
security.jwt.internal.signing.previous-public-key=${JWT_INTERNAL_SIGNING_PREVIOUS_PUBLIC_KEY:}
security.jwt.internal.signing.previous-key-id=${JWT_INTERNAL_SIGNING_PREVIOUS_KEY_ID:}
security.jwt.internal.signing.allow-generated-key=${JWT_INTERNAL_ALLOW_GENERATED_KEY:true}
security.jwt.expiration-in-ms=3600000

account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8080}
account-service.timeout=${ACCOUNT_SERVICE_TIMEOUT:30000}
account-service.resilience.retry.max-attempts=${ACCOUNT_SERVICE_RETRY_MAX_ATTEMPTS:3}
account-service.resilience.retry.wait-duration=${ACCOUNT_SERVICE_RETRY_WAIT_DURATION:1000}
account-service.resilience.circuit-breaker.failure-rate-threshold=${ACCOUNT_SERVICE_CB_FAILURE_RATE:50}
account-service.resilience.circuit-breaker.wait-duration-in-open-state=${ACCOUNT_SERVICE_CB_WAIT_DURATION:30000}
account-service.resilience.circuit-breaker.sliding-window-size=${ACCOUNT_SERVICE_CB_SLIDING_WINDOW:10}
account-service.resilience.circuit-breaker.minimum-number-of-calls=${ACCOUNT_SERVICE_CB_MIN_CALLS:5}
account-service.resilience.time-limiter.timeout=${ACCOUNT_SERVICE_TIMEOUT:30000}

transaction.processing.timeout=30000
transaction.retry.max-attempts=3
transaction.retry.delay=1000

# Outcome Protection / Money Debugger bounded deterministic simulation
outcome-protection.search.max-combination-size=${OUTCOME_PROTECTION_MAX_COMBINATION_SIZE:3}
outcome-protection.search.max-evaluated-combinations=${OUTCOME_PROTECTION_MAX_EVALUATED_COMBINATIONS:5000}
outcome-protection.repair-search.max-combination-size=${OUTCOME_PROTECTION_REPAIR_MAX_COMBINATION_SIZE:3}
outcome-protection.repair-search.max-evaluated-combinations=${OUTCOME_PROTECTION_REPAIR_MAX_EVALUATED_COMBINATIONS:500}
outcome-protection.monitor.fixed-delay-ms=${OUTCOME_PROTECTION_MONITOR_DELAY_MS:300000}
outcome-protection.monitor.initial-delay-ms=${OUTCOME_PROTECTION_MONITOR_INITIAL_DELAY_MS:60000}
outcome-protection.notifications.max-attempts=${OUTCOME_PROTECTION_NOTIFICATION_MAX_ATTEMPTS:5}
outcome-protection.notifications.initial-backoff-seconds=${OUTCOME_PROTECTION_NOTIFICATION_INITIAL_BACKOFF_SECONDS:30}
outcome-protection.notifications.max-backoff-seconds=${OUTCOME_PROTECTION_NOTIFICATION_MAX_BACKOFF_SECONDS:900}
outcome-protection.notifications.sla-seconds=${OUTCOME_PROTECTION_NOTIFICATION_SLA_SECONDS:300}
outcome-protection.notifications.dispatch-delay-ms=${OUTCOME_PROTECTION_NOTIFICATION_DISPATCH_DELAY_MS:5000}
outcome-protection.notifications.dispatch-initial-delay-ms=${OUTCOME_PROTECTION_NOTIFICATION_DISPATCH_INITIAL_DELAY_MS:5000}
outcome-protection.fx.rates=${OUTCOME_PROTECTION_FX_RATES:}
outcome-protection.fx.as-of=${OUTCOME_PROTECTION_FX_AS_OF:}
spring.jackson.time-zone=${APP_TIME_ZONE:UTC}
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:UTC}

outcome-protection.fx.provider=${OUTCOME_PROTECTION_FX_PROVIDER:UNCONFIGURED}
outcome-protection.fx.provenance=${OUTCOME_PROTECTION_FX_PROVENANCE:}
outcome-protection.fx.max-age-seconds=${OUTCOME_PROTECTION_FX_MAX_AGE_SECONDS:86400}
outcome-protection.fx.staleness-policy=${OUTCOME_PROTECTION_FX_STALENESS_POLICY:REJECT}

security.step-up.enabled=${STEP_UP_ENABLED:false}
security.step-up.high-value-threshold=${STEP_UP_HIGH_VALUE_THRESHOLD:5000.00}
security.step-up.beneficiary-cooling-hours=${STEP_UP_BENEFICIARY_COOLING_HOURS:24}
security.step-up.rapid-transfer-window-minutes=${STEP_UP_RAPID_TRANSFER_WINDOW_MINUTES:10}
security.step-up.rapid-transfer-count=${STEP_UP_RAPID_TRANSFER_COUNT:5}
security.step-up.recent-unfreeze-hours=${STEP_UP_RECENT_UNFREEZE_HOURS:24}

logging.level.com.suhasan.finance.transaction_service=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
outcome-protection.guardrails.terms-version=${OUTCOME_GUARDRAIL_TERMS_VERSION:2026-07-16.1}
integration.risk.provider=${BALANCE_SHIELD_RISK_PROVIDER:local-deterministic}
integration.risk.contract-id=${BALANCE_SHIELD_RISK_CONTRACT_ID:local-development}
integration.risk.policy-version=${BALANCE_SHIELD_RISK_POLICY_VERSION:local-v1}
integration.risk.authentication-reference=${BALANCE_SHIELD_RISK_AUTH_REFERENCE:local-none}
integration.risk.local-mode=${BALANCE_SHIELD_RISK_LOCAL_MODE:ALLOW}
integration.fx.provider-mode=${BALANCE_SHIELD_FX_PROVIDER_MODE:local-configured}
integration.fx.contract-id=${BALANCE_SHIELD_FX_CONTRACT_ID:local-development}
integration.fx.authentication-reference=${BALANCE_SHIELD_FX_AUTH_REFERENCE:local-none}
integration.fx.reconciliation-reference=${BALANCE_SHIELD_FX_RECONCILIATION_REFERENCE:local-static}
integration.consent.approved-version=${BALANCE_SHIELD_APPROVED_CONSENT_VERSION:2026-07-16.1}
integration.consent.jurisdictions=${BALANCE_SHIELD_ELIGIBLE_JURISDICTIONS:*}
integration.consent.retention-policy=${BALANCE_SHIELD_CONSENT_RETENTION_POLICY:local-development}
integration.consent.accessibility-reference=${BALANCE_SHIELD_ACCESSIBILITY_REFERENCE:review-required}
integration.iam.issuer=${OPERATOR_IDP_ISSUER:local-account-service}
integration.iam.audience=${OPERATOR_IDP_AUDIENCE:transaction-service}
integration.iam.role-mappings=${OPERATOR_IDP_ROLE_MAPPINGS:admin=ROLE_ADMIN}
integration.iam.access-review-reference=${OPERATOR_ACCESS_REVIEW_REFERENCE:local-review}
integration.iam.revocation-feed=${OPERATOR_REVOCATION_FEED:local-none}
integration.iam.access-review-max-age-days=${OPERATOR_ACCESS_REVIEW_MAX_AGE_DAYS:90}

# OpenAPI: spec at /v3/api-docs, UI at /swagger-ui.html. Off unless API_DOCS_ENABLED=true
# (dev, sandbox); the committed spec in docs/api/ is the reference everywhere else.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
springdoc.default-produces-media-type=application/json
