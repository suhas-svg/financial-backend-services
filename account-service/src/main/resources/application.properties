spring.application.name=account-service
spring.profiles.default=dev
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=${spring.profiles.active:${spring.profiles.default}}

security.jwt.secret=${JWT_SECRET}
security.jwt.internal-secret=${INTERNAL_JWT_SECRET}
security.jwt.expiration-in-ms=3600000
security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
integration.notification.provider=${NOTIFICATION_PROVIDER:local-inbox}
integration.notification.contract-id=${NOTIFICATION_PROVIDER_CONTRACT_ID:local-development}
integration.iam.issuer=${OPERATOR_IDP_ISSUER:local-account-service}
integration.iam.audience=${OPERATOR_IDP_AUDIENCE:account-service}
integration.iam.role-mappings=${OPERATOR_IDP_ROLE_MAPPINGS:admin=ROLE_ADMIN}
integration.iam.access-review-reference=${OPERATOR_ACCESS_REVIEW_REFERENCE:local-review}
integration.iam.revocation-feed=${OPERATOR_REVOCATION_FEED:local-none}
integration.iam.access-review-max-age-days=${OPERATOR_ACCESS_REVIEW_MAX_AGE_DAYS:90}
integration.mfa.kms.provider=${MFA_KMS_PROVIDER:local-key}
integration.mfa.kms.active-key-id=${MFA_ACTIVE_KEY_ID:local-v1}
integration.mfa.kms.previous-keys=${MFA_PREVIOUS_KEYS:}
integration.mfa.kms.health-reference=${MFA_KMS_HEALTH_REFERENCE:local-key}
security.step-up.challenge-ttl-seconds=${STEP_UP_CHALLENGE_TTL_SECONDS:300}
security.step-up.proof-ttl-seconds=${STEP_UP_PROOF_TTL_SECONDS:120}
security.step-up.max-attempts=${STEP_UP_MAX_ATTEMPTS:5}

logging.level.com.suhasan.finance.account_service=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
