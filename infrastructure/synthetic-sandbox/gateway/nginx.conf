user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format redacted '$remote_addr - $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log redacted;
    server_tokens off;

    map $http_origin $sandbox_origin_denied {
        default 1;
        "" 0;
        "https://localhost:__SANDBOX_HTTPS_PORT__" 0;
        "https://127.0.0.1:__SANDBOX_HTTPS_PORT__" 0;
    }

    upstream frontend { server frontend:8080; }
    upstream account_service { server account-service:8080; }
    upstream transaction_service { server transaction-service:8081; }

    server {
        listen 8443 ssl;
        server_name localhost 127.0.0.1;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Environment-Classification "SYNTHETIC_SANDBOX" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location /account-api/ {
            if ($sandbox_origin_denied) { return 403; }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://account_service/;
        }

        location /transaction-api/ {
            if ($sandbox_origin_denied) { return 403; }
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://transaction_service/;
        }

        location / {
            proxy_set_header Host $host;
            proxy_pass http://frontend;
        }
    }
}
