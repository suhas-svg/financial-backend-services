{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "account-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "account-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "account-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- end }}
  {{- if or .Values.networkPolicy.egress .Values.tracing.otlpEndpoint }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.tracing.otlpEndpoint }}
    # OTLP span export to the tracing collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.tracing.collectorNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.tracing.collectorPort }}
    {{- end }}
  {{- end }}
{{- end }}