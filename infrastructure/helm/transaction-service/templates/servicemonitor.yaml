{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "transaction-service.fullname" . }}
  namespace: {{ .Values.monitoring.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "transaction-service.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "transaction-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.serviceMonitor.path }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      # /actuator/prometheus requires authentication. Prefer scrapeToken (the
      # service accepts it via METRICS_SCRAPE_TOKEN); the same secret must exist in
      # the ServiceMonitor's namespace for the Prometheus Operator to read it.
      {{- if .Values.monitoring.serviceMonitor.authorization }}
      authorization:
        {{- toYaml .Values.monitoring.serviceMonitor.authorization | nindent 8 }}
      {{- else if .Values.monitoring.serviceMonitor.scrapeToken.secretName }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.monitoring.serviceMonitor.scrapeToken.secretName }}
          key: {{ .Values.monitoring.serviceMonitor.scrapeToken.key | default "token" }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
