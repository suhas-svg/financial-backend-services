# Security headers for every response from the static frontend. Included in each
# location because nginx drops server-level add_header directives in any location
# that sets its own. Keep in sync with infrastructure/synthetic-sandbox/gateway/nginx.conf.
#
# The CSP is the main defence against script injection while access tokens live in
# browser storage: only same-origin scripts run (no inline or eval), the app can only
# talk to its own origin, and it cannot be framed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
